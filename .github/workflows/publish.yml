name: Publish site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.43

      # Only needed once posts contain executable R chunks. Freeze
      # (execute: freeze: auto) means committed _freeze results are reused,
      # so most builds never touch R at all.
      # - uses: r-lib/actions/setup-r@v2
      # - uses: r-lib/actions/setup-renv@v2

      - name: Render site
        run: quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
